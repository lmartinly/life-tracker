<style>
:root{
  /* board: Terracotta #C96A3A · Indigo #3E4DBA · Dusty Rose #A55C7A · Sage #9AA17B · Cream #F7F0E8 */
  --bg:#F7F0E8; --surface:#FFFFFF; --surface2:#EFE6DA; --line:#E7DCCE;
  --text:#3A332B; --muted:#8D8374; --faint:#B5AA97;
  --coral:#C96A3A; --coral-soft:#F6E3D5; --coral-deep:#9A4E26;      /* terracotta */
  --teal:#3E4DBA; --teal-soft:#E4E6F8; --teal-deep:#2E3A96;         /* indigo */
  --pink:#A55C7A; --pink-soft:#F2E1E9; --pink-deep:#82425E;         /* dusty rose */
  --mint:#9AA17B; --mint-soft:#EBEDDE; --mint-deep:#6E7552;         /* sage */
  --lav:#8A4E68; --lav-soft:#F0E2E9; --lav-deep:#6D3A51;            /* plum — dusty rose, darkened */
  --peach:#6C79D6; --peach-soft:#E9EBFA; --peach-deep:#4553A8;      /* periwinkle — indigo, lightened */
  --shadow:0 10px 30px rgba(92,72,48,.09), 0 1px 3px rgba(92,72,48,.05);
  --shadow-sm:0 4px 14px rgba(92,72,48,.07), 0 1px 2px rgba(92,72,48,.04);
  --r-lg:26px; --r-md:20px; --r-sm:14px;
  --ease:cubic-bezier(.32,.72,.33,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html{height:100%}
body{
  background:var(--bg); color:var(--text); min-height:100dvh;
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:none; touch-action:manipulation;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
img{display:block;max-width:100%}
svg{display:block}
.num{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
#app{max-width:520px;margin:0 auto;min-height:100dvh;position:relative}
.screen{padding:0 18px calc(34px + env(safe-area-inset-bottom))}
.topbar{
  position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:10px;
  padding:calc(12px + env(safe-area-inset-top)) 18px 10px;
  background:linear-gradient(180deg,var(--bg) 72%,rgba(246,243,237,0));
}
.topbar .title{font-size:22px;font-weight:700;letter-spacing:-.02em;flex:1;display:flex;align-items:center;gap:9px;min-width:0}
.topbar .title span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logo-img{width:24px;height:24px;border-radius:7px;display:block}
.logo-dot{width:12px;height:12px;border-radius:50%;background:linear-gradient(160deg,#EE947A,#DE705C);flex:none;box-shadow:0 2px 6px rgba(222,112,92,.4)}
.tbtn{
  width:40px;height:40px;border-radius:14px;background:var(--surface);flex:none;
  box-shadow:var(--shadow-sm);display:grid;place-items:center;color:var(--text);
  transition:transform .18s var(--ease);
}
.tbtn:active{transform:scale(.92)}
.back-btn{display:flex;align-items:center;gap:2px;height:40px;padding:0 14px 0 8px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow-sm);font-weight:600;font-size:15px;flex:none}
.back-btn:active{transform:scale(.95)}
.datebar{padding:2px 18px 14px;color:var(--muted);font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:999px;font-size:12.5px;font-weight:600}
.pill.coral{background:var(--coral-soft);color:var(--coral-deep)}
.pill.teal{background:var(--teal-soft);color:var(--teal-deep)}
.pill.mint{background:var(--mint-soft);color:var(--mint-deep)}
.pill.pink{background:var(--pink-soft);color:var(--pink-deep)}
.pill.lav{background:var(--lav-soft);color:var(--lav-deep)}
.pill.peach{background:var(--peach-soft);color:var(--peach-deep)}
.pill.gray{background:var(--surface2);color:var(--muted)}

/* ---------- cards ---------- */
.card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:18px;margin-bottom:14px;position:relative}
.card.press{transition:transform .18s var(--ease)}
.card.press:active{transform:scale(.98)}
.card-head{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.card-head .dot{width:9px;height:9px;border-radius:50%;flex:none}
.card-head h3{font-size:16.5px;font-weight:700;letter-spacing:-.01em;flex:1}
.dot.coral{background:var(--coral)} .dot.teal{background:var(--teal)} .dot.pink{background:var(--pink)}
.dot.mint{background:var(--mint)} .dot.lav{background:var(--lav)} .dot.peach{background:var(--peach)}
.mini-add{width:32px;height:32px;border-radius:11px;display:grid;place-items:center;background:var(--surface2);color:var(--muted);transition:transform .15s var(--ease)}
.mini-add:active{transform:scale(.88)}
.chev-ico{color:var(--faint);flex:none}
.sec-label{font-size:12.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin:22px 4px 10px}
.sec-label:first-child{margin-top:4px}

/* ---------- stats grid ---------- */
/* --- icon chips: soft colored containers giving each section its character --- */
.ichip{width:31px;height:31px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
.ichip.coral{background:var(--coral-soft);color:var(--coral-deep)}
.ichip.teal{background:var(--teal-soft);color:var(--teal-deep)}
.ichip.pink{background:var(--pink-soft);color:var(--pink-deep)}
.ichip.mint{background:var(--mint-soft);color:var(--mint-deep)}
.ichip.lav{background:var(--lav-soft);color:var(--lav-deep)}
.ichip.peach{background:var(--peach-soft);color:var(--peach-deep)}
/* --- hero tiles (priority row) --- */
.tilegrid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:14px}
.tile{border-radius:var(--r-md);box-shadow:var(--shadow-sm);padding:14px 15px;min-height:112px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;transition:transform .18s var(--ease)}
.tile:active{transform:scale(.96)}
.tile .tk{font-size:12px;font-weight:600;display:flex;align-items:center;gap:7px}
.tile .tv{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-top:8px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .ts{display:block;font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.terra{background:linear-gradient(150deg,var(--coral-soft),#FBF2EA)}
.tile.terra .tk,.tile.terra .ts{color:var(--coral-deep)}.tile.terra .tv{color:#7E3F1C}
.tile.indigo{background:linear-gradient(150deg,var(--teal-soft),#EFF1FB)}
.tile.indigo .tk,.tile.indigo .ts{color:var(--teal-deep)}.tile.indigo .tv{color:#28348E}
.tile .ring-txt{font-size:9.5px}
/* --- journey card --- */
.journey{background:linear-gradient(155deg,var(--mint-soft),#F4F6EC)}
.jstats{display:flex;gap:6px;margin:10px 0 2px;flex-wrap:wrap}
.jstat{flex:1;min-width:70px;background:rgba(255,253,248,.72);border-radius:13px;padding:9px 10px}
.jstat b{display:block;font-size:17px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--mint-deep)}
.jstat span{font-size:10.5px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.insight{display:flex;gap:9px;align-items:flex-start;padding:9px 2px;font-size:14px;line-height:1.45;color:var(--text)}
.insight+.insight{border-top:1px dashed var(--line)}
.insight .ii{flex:none;width:26px;height:26px;border-radius:9px;background:var(--mint-soft);color:var(--mint-deep);display:flex;align-items:center;justify-content:center;margin-top:-1px}
.recrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:11px 2px}
.recrow+.recrow{border-top:1px solid var(--line)}
.recrow .rl{font-size:13.5px;color:var(--muted);font-weight:600}
.recrow .rv{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.recrow .rd{display:block;font-size:11.5px;color:var(--faint);font-weight:500;margin-top:1px}
/* --- dynamic today cards --- */
.todaycard{border-radius:var(--r-lg);padding:16px 17px;margin-bottom:14px;box-shadow:var(--shadow-sm)}
.todaycard.sympt{background:linear-gradient(150deg,var(--peach-soft),#F2F3FC)}
.todaycard.week{background:linear-gradient(150deg,var(--teal-soft),#EDEFFA)}
.todaycard h3{font-size:15.5px;font-weight:700;display:flex;align-items:center;gap:8px}
.todaycard p{font-size:13.5px;color:var(--muted);margin-top:5px;line-height:1.5}
.wkrow{display:flex;justify-content:space-between;font-size:13.5px;padding:7px 0;border-bottom:1px dashed var(--line)}
.wkrow:last-of-type{border-bottom:0}
.wkrow b{font-variant-numeric:tabular-nums}
.mgroup{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin:14px 0 2px}
.mgroup:first-child{margin-top:0}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:14px}
.stat{background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow-sm);padding:14px 15px;transition:transform .18s var(--ease);min-height:86px;display:flex;flex-direction:column;justify-content:space-between}
.stat:active{transform:scale(.96)}
.stat .k{font-size:12px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px}
.stat .k .sdot{width:7px;height:7px;border-radius:50%;flex:none}
.stat .v{display:block;font-size:21px;font-weight:700;letter-spacing:-.02em;margin-top:6px;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat .s{display:block;font-size:12px;color:var(--faint);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- checklist ---------- */
.check-card{background:linear-gradient(150deg,#FBEDE6,#F9E4DA);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:18px;margin-bottom:14px}
.check-row{display:flex;align-items:center;gap:13px;padding:11px 2px;border-bottom:1px solid rgba(192,95,71,.1)}
.check-row:last-child{border-bottom:0}
.checkbox{width:27px;height:27px;border-radius:50%;border:2px solid rgba(192,95,71,.4);flex:none;display:grid;place-items:center;color:#fff;background:transparent;transition:all .2s var(--ease)}
.check-row.done .checkbox{background:var(--coral);border-color:var(--coral)}
.check-row .txt{flex:1;font-size:15.5px;font-weight:500;transition:color .2s,opacity .2s}
.check-row.done .txt{color:var(--coral-deep);opacity:.55;text-decoration:line-through}
.check-prog{font-size:13px;font-weight:700;color:var(--coral-deep)}

/* ---------- lists & rows ---------- */
.list{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--surface2);transition:background .15s}
.row:last-child{border-bottom:0}
.row:active{background:var(--surface2)}
.row .rmain{flex:1;min-width:0}
.row .rtitle{font-size:15.5px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row .rsub{font-size:13px;color:var(--muted);margin-top:2px}
.row .rside{text-align:right;flex:none}
.row .rval{font-size:15.5px;font-weight:700;font-variant-numeric:tabular-nums}
.rnote{font-size:13px;color:var(--muted);margin-top:4px;background:var(--surface2);border-radius:10px;padding:7px 10px;white-space:pre-wrap;word-break:break-word}
.sev{display:inline-flex;gap:3px}
.sev i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.sev i.on{background:var(--peach)}
.badge-day{font-size:11.5px;font-weight:700;background:var(--surface2);color:var(--muted);border-radius:7px;padding:2px 7px}

/* ---------- buttons ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:51px;border-radius:16px;font-size:16px;font-weight:650;transition:transform .15s var(--ease),opacity .15s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45}
.btn-primary{background:var(--text);color:#fff;box-shadow:0 6px 18px rgba(56,50,44,.25)}
.btn-tonal{background:var(--surface2);color:var(--text)}
.btn-ghost{background:transparent;color:var(--muted);height:44px}
.btn-danger{background:#FBE9E5;color:#B8432E}
.btn-sm{height:40px;font-size:14.5px;border-radius:13px;width:auto;padding:0 16px}
.btnrow{display:flex;gap:10px}
.btnrow .btn{flex:1}

/* ---------- forms ---------- */
.f-label{font-size:12.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin:16px 2px 7px;display:block}
.f-label:first-child{margin-top:0}
.field{width:100%;background:var(--surface2);border:1.5px solid transparent;border-radius:var(--r-sm);padding:13px 14px;font-size:16px;outline:none;transition:border-color .15s;-webkit-appearance:none;appearance:none;color:var(--text)}
.field:focus{border-color:var(--faint);background:var(--surface)}
textarea.field{resize:vertical;min-height:74px;font-family:inherit}
select.field{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%238E857A' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 13px center;padding-right:38px}
.f-2col{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f-hint{font-size:12.5px;color:var(--faint);margin:7px 3px 0;line-height:1.45}
input[type="datetime-local"].field,input[type="time"].field{min-height:49px}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 15px;border-radius:999px;background:var(--surface2);font-size:14.5px;font-weight:600;color:var(--text);border:1.5px solid transparent;transition:all .15s var(--ease)}
.chip:active{transform:scale(.94)}
.chip.on{background:var(--text);color:#fff}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding:2px 2px 6px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.sitegrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.sitebtn{padding:13px 10px;border-radius:var(--r-sm);background:var(--surface2);font-size:14px;font-weight:600;border:1.5px solid transparent;position:relative;text-align:center;transition:all .15s var(--ease)}
.sitebtn.on{background:var(--coral-soft);border-color:var(--coral);color:var(--coral-deep)}
.sitebtn .tag{display:block;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-top:3px;color:var(--faint)}
.sitebtn.on .tag{color:var(--coral)}
/* severity */
.sevpick{display:flex;gap:8px}
.sevbtn{flex:1;height:48px;border-radius:var(--r-sm);background:var(--surface2);font-weight:700;font-size:16px;border:1.5px solid transparent;transition:all .15s var(--ease)}
.sevbtn.on{background:var(--peach-soft);border-color:var(--peach);color:var(--peach-deep)}

/* ---------- hero blocks ---------- */
.hero{display:flex;align-items:center;gap:18px}
.hero-num{font-size:42px;font-weight:800;letter-spacing:-.03em;line-height:1.05;font-variant-numeric:tabular-nums}
.hero-num small{font-size:19px;font-weight:700;color:var(--muted);letter-spacing:0}
.hero-sub{font-size:13.5px;color:var(--muted);margin-top:4px}
.delta{font-weight:700}
.delta.down{color:var(--mint-deep)} .delta.up{color:var(--coral-deep)} .delta.flat{color:var(--muted)}
.kv{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--surface2);font-size:14.5px}
.kv:last-child{border-bottom:0}
.kv b{font-variant-numeric:tabular-nums;font-weight:700}
.kv span{color:var(--muted)}
.progressbar{height:9px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:10px}
.progressbar i{display:block;height:100%;border-radius:99px;transition:width .5s var(--ease)}

/* ---------- charts ---------- */
.chartwrap{margin:6px -4px 2px}
.chart-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--muted)}
.chart-legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.empty{padding:26px 16px;text-align:center;color:var(--muted);font-size:14.5px;line-height:1.5}
.empty .big{font-size:30px;margin-bottom:8px}

/* ---------- calendar ---------- */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 14px}
.cal-head b{font-size:18px;letter-spacing:-.01em}
.cal-nav{width:38px;height:38px;border-radius:13px;background:var(--surface);box-shadow:var(--shadow-sm);display:grid;place-items:center}
.cal-nav:active{transform:scale(.9)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-dow{text-align:center;font-size:11.5px;font-weight:700;color:var(--faint);padding:4px 0;text-transform:uppercase;letter-spacing:.05em}
.cal-cell{aspect-ratio:1/1.12;border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:14.5px;font-weight:600;font-variant-numeric:tabular-nums;position:relative;transition:all .15s var(--ease)}
.cal-cell.day{background:var(--surface);box-shadow:var(--shadow-sm)}
.cal-cell.day:active{transform:scale(.9)}
.cal-cell.today{outline:2px solid var(--text);outline-offset:-2px}
.cal-cell.sel{background:var(--text);color:#fff}
.cal-dots{display:flex;gap:3px;height:5px}
.cal-dots i{width:5px;height:5px;border-radius:50%}
.cal-legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin:16px 4px 0;font-size:12.5px;color:var(--muted)}
.cal-legend span{display:inline-flex;align-items:center;gap:6px}
.cal-legend i{width:7px;height:7px;border-radius:50%}

/* ---------- photos ---------- */
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pcell{aspect-ratio:3/4;border-radius:15px;overflow:hidden;position:relative;background:var(--surface2);transition:transform .15s var(--ease)}
.pcell:active{transform:scale(.95)}
.pcell img{width:100%;height:100%;object-fit:cover}
.pcell .pdate{position:absolute;left:0;right:0;bottom:0;padding:14px 8px 6px;font-size:10.5px;font-weight:700;color:#fff;background:linear-gradient(transparent,rgba(30,20,15,.55));text-align:center}
.pcell.selmode::after{content:"";position:absolute;inset:0;border-radius:15px;border:2.5px solid transparent}
.pcell.selected::after{border-color:var(--lav)}
.pcell .selnum{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:var(--lav);color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center}
.pstrip{display:flex;gap:9px;overflow-x:auto;padding:2px 2px 6px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.pstrip::-webkit-scrollbar{display:none}
.pstrip .pcell{flex:none;width:88px}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.compare img{width:100%;border-radius:15px;aspect-ratio:3/4;object-fit:cover;background:var(--surface2)}
.compare .cinfo{text-align:center;font-size:12.5px;color:var(--muted);margin-top:7px;line-height:1.5}
.compare .cinfo b{display:block;color:var(--text);font-size:14px}
.photoview img{width:100%;border-radius:18px;background:var(--surface2)}

/* ---------- pages ---------- */
.page{
  position:fixed;inset:0;margin:0 auto;max-width:520px;background:var(--bg);z-index:20;
  transform:translateX(105%);transition:transform .26s var(--ease);
  overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
}
.page.in{transform:translateX(0)}
.page-body{padding:2px 18px calc(40px + env(safe-area-inset-bottom))}

/* ---------- sheets ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet-back{position:absolute;inset:0;background:rgba(45,36,28,.38);opacity:0;transition:opacity .24s}
.sheet-wrap.in .sheet-back{opacity:1}
.sheet{
  position:relative;width:100%;max-width:520px;background:var(--bg);border-radius:28px 28px 0 0;
  padding:10px 20px calc(24px + env(safe-area-inset-bottom));max-height:90dvh;overflow-y:auto;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  transform:translateY(102%);transition:transform .28s var(--ease);box-shadow:0 -12px 40px rgba(60,48,38,.18);
}
.sheet-wrap.in .sheet{transform:translateY(0)}
.grab{width:38px;height:5px;border-radius:99px;background:var(--line);margin:2px auto 14px}
.sheet h2{font-size:20px;font-weight:750;letter-spacing:-.02em;margin-bottom:4px}
.sheet .sheet-sub{font-size:13.5px;color:var(--muted);margin-bottom:10px}
.sheet-actions{margin-top:22px;display:flex;flex-direction:column;gap:9px}

/* ---------- dialog / toast ---------- */
.dlg-wrap{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:28px}
.dlg-back{position:absolute;inset:0;background:rgba(45,36,28,.42);opacity:0;transition:opacity .2s}
.dlg{position:relative;width:100%;max-width:330px;background:var(--surface);border-radius:22px;padding:22px 20px 16px;text-align:center;transform:scale(.92);opacity:0;transition:all .2s var(--ease);box-shadow:0 20px 60px rgba(50,40,30,.3)}
.dlg-wrap.in .dlg-back{opacity:1}
.dlg-wrap.in .dlg{transform:scale(1);opacity:1}
.dlg h4{font-size:17px;font-weight:750;margin-bottom:7px}
.dlg p{font-size:14px;color:var(--muted);line-height:1.5;margin-bottom:16px;white-space:pre-line}
.dlg .btn{height:46px;font-size:15px;margin-bottom:8px}
.dlg .btn:last-child{margin-bottom:0}
#toasts{position:fixed;left:0;right:0;bottom:calc(22px + env(safe-area-inset-bottom));z-index:80;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:var(--text);color:#fff;font-size:14px;font-weight:600;padding:11px 19px;border-radius:999px;box-shadow:0 8px 24px rgba(40,32,26,.3);opacity:0;transform:translateY(12px);transition:all .25s var(--ease);max-width:86%;text-align:center}
.toast.in{opacity:1;transform:translateY(0)}

/* ---------- misc ---------- */
.ring-wrap{position:relative;flex:none}
.ring-txt{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;font-weight:800;font-variant-numeric:tabular-nums}
.banner{border-radius:var(--r-md);padding:13px 15px;font-size:13.5px;line-height:1.5;margin-bottom:14px}
.banner.warn{background:#FBF0DC;color:#8A6420}
.banner.err{background:#FBE9E5;color:#B8432E}
.footnote{font-size:12px;color:var(--faint);line-height:1.55;margin:14px 6px 0}
.divider{height:1px;background:var(--surface2);margin:14px 0}
.iconbtn-sm{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--surface2);color:var(--muted);flex:none}
.iconbtn-sm:active{transform:scale(.88)}
.tag-last{font-size:10.5px;font-weight:800;letter-spacing:.06em;color:var(--lav-deep);background:var(--lav-soft);border-radius:6px;padding:2px 6px;text-transform:uppercase}
.switch{position:relative;width:50px;height:30px;flex:none}
.switch input{opacity:0;width:100%;height:100%;position:absolute;z-index:2;margin:0}
.switch i{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:background .2s}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .2s var(--ease)}
.switch input:checked + i{background:var(--mint)}
.switch input:checked + i::after{transform:translateX(20px)}
.setrow{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--surface2)}
.setrow:last-child{border-bottom:0}
.setrow .smain{flex:1;min-width:0}
.setrow .stitle{font-size:15.5px;font-weight:600}
.setrow .ssub{font-size:12.5px;color:var(--muted);margin-top:1px}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}
@keyframes fadeup{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.fadeup{animation:fadeup .3s var(--ease)}
</style>
</head>
<body>
<div id="app">
  <div id="dash-topbar"></div>
  <div id="root" class="screen"></div>
</div>
<div id="pages"></div>
<div id="overlays"></div>
<div id="toasts"></div>
<script>
'use strict';
/* ============================================================
   Mounjaro Tracker — single-file PWA
   Layers: utils · core logic (PK/dates) · Store · PhotoDB ·
           UI kit · charts · pages · Drive sync · boot
   ============================================================ */

/* ---------------- utils ---------------- */
const DAY = 86400000;
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function pad2(n) { return (n < 10 ? '0' : '') + n; }
function clamp(v, a, b) { return Math.min(b, Math.max(a, v)); }
/* Turkish-friendly numbers: accept "92,4" or "92.4" on input, display with comma */
function parseNum(v) {
  v = String(v == null ? '' : v).trim().replace(/\s/g, '').replace(',', '.');
  const n = parseFloat(v);
  return isNaN(n) ? null : n;
}
const DTF = {
  wd: new Intl.DateTimeFormat('en', { weekday: 'short' }),
  wdl: new Intl.DateTimeFormat('en', { weekday: 'long' }),
  md: new Intl.DateTimeFormat('en', { month: 'short', day: 'numeric' }),
  mdy: new Intl.DateTimeFormat('en', { month: 'short', day: 'numeric', year: 'numeric' }),
  mo: new Intl.DateTimeFormat('en', { month: 'long', year: 'numeric' }),
  tm: new Intl.DateTimeFormat('en-GB', { hour: '2-digit', minute: '2-digit' })
};
function fmtDate(d) { d = new Date(d); const now = new Date(); return d.getFullYear() === now.getFullYear() ? DTF.wd.format(d) + ', ' + DTF.md.format(d) : DTF.md.format(d) + ', ' + d.getFullYear(); }
function fmtDT(d) { return fmtDate(d) + ' · ' + DTF.tm.format(new Date(d)); }
function fmtTime(d) { return DTF.tm.format(new Date(d)); }
function toInputDT(d) { d = new Date(d); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) + 'T' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }
function fmtKg(v) { return (Math.round(v * 10) / 10).toFixed(1).replace(".", ","); }
function fmtMg(v) { return String(+(v.toFixed(v >= 10 ? 1 : 2))).replace('.', ','); }
function fmtCm(v) { return String(+(+v).toFixed(1)).replace('.', ','); }
function relDays(n) { return n === 0 ? 'Today' : n === 1 ? 'Tomorrow' : n === -1 ? 'Yesterday' : n > 0 ? 'in ' + n + 'd' : Math.abs(n) + 'd ago'; }
const WEEKDAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

/* ---------------- icons ---------------- */
function ic(name, size) {
  const S = size || 22;
  const P = {
    back: '<path d="M14.5 5l-7 7 7 7"/>',
    chevR: '<path d="M9.5 5l7 7-7 7"/>',

    plus: '<path d="M12 5v14M5 12h14"/>',
    x: '<path d="M6 6l12 12M18 6L6 18"/>',
    check: '<path d="M4.5 12.5l5 5L19.5 7"/>',
    cal: '<rect x="3.5" y="5" width="17" height="16" rx="4"/><path d="M3.5 10h17M8 2.5V6M16 2.5V6"/>',
    gear: '<path d="M4 7.5h10M18 7.5h2M4 16.5h2M10 16.5h10"/><circle cx="16" cy="7.5" r="2.6"/><circle cx="8" cy="16.5" r="2.6"/>',
    trash: '<path d="M4.5 6.5h15M9.5 6V4.5A1.5 1.5 0 0 1 11 3h2a1.5 1.5 0 0 1 1.5 1.5V6M7 6.5l.8 12.5a2 2 0 0 0 2 1.9h4.4a2 2 0 0 0 2-1.9L17 6.5"/>',
    pencil: '<path d="M4 20l4.5-1 11-11a2.1 2.1 0 0 0-3-3l-11 11L4 20z"/>',
    camera: '<rect x="3" y="6.5" width="18" height="14" rx="4"/><circle cx="12" cy="13.5" r="4"/><path d="M8.5 6.5L10 4h4l1.5 2.5"/>',
    share: '<path d="M12 15V3.5M7.5 7.5L12 3l4.5 4.5"/><path d="M5 12v6.5A2.5 2.5 0 0 0 7.5 21h9a2.5 2.5 0 0 0 2.5-2.5V12"/>',
    cloud: '<path d="M7 18.5a4.5 4.5 0 0 1-.5-8.97A6 6 0 0 1 18 10.5a4 4 0 0 1-.5 8H7z"/>',

/* ---------------- core logic (tested) ---------------- */
const PK = {
  halfLifeDays: 5,      // tirzepatide elimination half-life ~5 days (~120 h)
  ka: 3.36,             // /day absorption rate -> tmax ~= 24 h
  F: 0.80,              // subcutaneous bioavailability
  get ke() { return Math.LN2 / this.halfLifeDays; },
  contribution(doseMg, days) {
    if (days < 0 || days > 60) return 0;
    const ke = this.ke, ka = this.ka;
    const v = doseMg * this.F * (ka / (ka - ke)) * (Math.exp(-ke * days) - Math.exp(-ka * days));
    return v > 0 ? v : 0;
  },
  totalAt(injections, when) {
    const t = typeof when === 'number' ? when : when.getTime();
    let s = 0;
    for (const inj of injections) {
      const days = (t - new Date(inj.dateTime).getTime()) / DAY;
      s += this.contribution(inj.doseMg, days);
    }
    return s;
  },
  peakInfo(injections, fromMs, horizonDays) {
    horizonDays = horizonDays || 10;
    let peak = 0, at = fromMs;
    for (let t = fromMs; t <= fromMs + horizonDays * DAY; t += 2 * 3600000) {
      const v = this.totalAt(injections, t);
      if (v > peak) { peak = v; at = t; }
    }
    return { peak: peak, at: at };
  }
};

function sod(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; }
function daysBetween(a, b) { return Math.round((sod(b) - sod(a)) / DAY); }

function nextInjectionDate(now, weekday, timeStr) {
  const parts = (timeStr || '22:00').split(':');
  const d = new Date(now);
  d.setHours(+parts[0] || 0, +parts[1] || 0, 0, 0);
  let delta = (weekday - d.getDay() + 7) % 7;
  if (delta === 0 && d.getTime() <= now.getTime()) delta = 7;
  d.setDate(d.getDate() + delta);
  return d;
}
function lastInjectionBefore(injections, when) {
  const t = typeof when === 'number' ? when : when.getTime();
  let best = null, bt = -Infinity;
  for (const i of injections) {
    const it = new Date(i.dateTime).getTime();
    if (it <= t && it > bt) { best = i; bt = it; }
  }
  return best;
}
/* Day 1 = injection day itself (calendar-based, uses the entry's own date) */
function dayAfterInjection(injections, entryDateTime) {
  const li = lastInjectionBefore(injections, new Date(entryDateTime).getTime());
  if (!li) return null;
  return daysBetween(new Date(li.dateTime), new Date(entryDateTime)) + 1;
}
const WEEK_ANCHOR = sod(new Date(2000, 0, 3)).getTime(); // a Monday
function weekIndex(d) { return Math.floor((sod(d).getTime() - WEEK_ANCHOR) / (7 * DAY)); }
function injectionStreak(injections) {
  if (!injections.length) return 0;
  const weeks = [...new Set(injections.map(i => weekIndex(new Date(i.dateTime))))].sort((a, b) => b - a);
  let n = 1;
  for (let i = 0; i < weeks.length - 1; i++) {
    if (weeks[i] - weeks[i + 1] === 1) n++; else break;
  }

}
function monthMatrix(year, month) {
  const first = new Date(year, month, 1);
  const offset = (first.getDay() + 6) % 7;
  const dim = new Date(year, month + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < offset; i++) cells.push(null);
  for (let d = 1; d <= dim; d++) cells.push(new Date(year, month, d));

}

    h ^= str.charCodeAt(i);
    h = (h + ((h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24))) >>> 0;

/* ---------------- Store ---------------- */
const Store = {

  normalize(d) {

      if (Array.isArray(d.measurements)) d.measurements.forEach(m => {
        if (m && typeof m === 'object') {
          if ('arm' in m) { if (m.arm != null && m.armL == null) m.armL = m.arm; delete m.arm; }
          if ('thigh' in m) { if (m.thigh != null && m.thighL == null) m.thighL = m.thigh; delete m.thigh; }

    },
    function v2to3(d) {

      if (Array.isArray(d.measurements)) d.measurements.forEach(m => {
        if (!m || typeof m !== 'object') return;
        [['thigh', 'thighL', 'thighR'], ['arm', 'armL', 'armR']].forEach(t => {
          const val = (m[t[0]] != null && m[t[0]] !== '') ? m[t[0]]
            : (m[t[1]] != null && m[t[1]] !== '') ? m[t[1]]
            : (m[t[2]] != null && m[t[2]] !== '') ? m[t[2]] : null;
          if (val != null) m[t[0]] = val;

    }
  ],
  migrate(d) {
    let v = (d && typeof d.schemaVersion === 'number') ? d.schemaVersion : 0;

  load() {

    }
    this.state = this.migrate(data);
    this.persist();
  },
  persist() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(this.state)); }

/* ---------------- derived state helpers ---------------- */
function injectionsSorted(desc) {

  return desc ? a.reverse() : a;
}

}
function lastInjection() { const a = injectionsSorted(true); return a[0] || null; }
function currentWeight() { const a = weightsSorted(true); return a[0] || null; }
function startWeight() {

  const a = weightsSorted(false); return a.length ? +a[0].kg : null;
}
function latestSymptom() {

function suggestedSite() {
  const li = lastInjection();

/* ---------------- journey engine ---------------- */
function fmtSign(v, unit, fmt) {
  fmt = fmt || fmtKg;
  if (v == null) return '—';
  if (Math.abs(v) < 0.05) return '±0 ' + unit;
  return (v < 0 ? '−' : '+') + fmt(Math.abs(v)) + ' ' + unit;
}
function firstInjection() { const a = injectionsSorted(false); return a[0] || null; }
function weeksSinceStart(now) {

  if (!f) return 0;

}
function longestStreak(injections) {
  if (!injections.length) return 0;
  const weeks = [...new Set(injections.map(i => weekIndex(new Date(i.dateTime))))].sort((a, b) => b - a);
  let best = 1, run = 1;
  for (let i = 0; i < weeks.length - 1; i++) {
    if (weeks[i] - weeks[i + 1] === 1) { run++; if (run > best) best = run; }
    else run = 1;
  }

}
/* per-field first/last/delta across all measurement entries */
function measurementDeltas() {
  const ms = Store.state.measurements.slice().sort((a, b) => new Date(a.dateTime) - new Date(b.dateTime));
  const out = {};
  MEAS_FIELDS.forEach(f => {
    const vals = ms.filter(m => m[f[0]] != null && m[f[0]] !== '');
    if (!vals.length) { out[f[0]] = null; return; }
    const first = +vals[0][f[0]], last = +vals[vals.length - 1][f[0]];
    out[f[0]] = { label: f[1], first, last, delta: last - first, n: vals.length, lastAt: vals[vals.length - 1].dateTime };
  });
  return out;
}

  deltas = deltas || measurementDeltas();

  MEAS_FIELDS.forEach(f => {
    const d = deltas[f[0]];
    if (d && d.n >= 2) { sum += d.delta; counted++; }
  });

}

  const ws = weightsSorted(false);
  if (ws.length < 2) return null;
  const byMonth = new Map(); /* 'YYYY-MM' -> last entry of that month */
  ws.forEach(w => {
    const d = new Date(w.dateTime);
    byMonth.set(d.getFullYear() + '-' + pad2(d.getMonth() + 1), w);
  });
  const keys = [...byMonth.keys()].sort();
  let best = null;
  for (let i = 1; i < keys.length; i++) {
    const loss = byMonth.get(keys[i - 1]).kg - byMonth.get(keys[i]).kg;
    if (loss > 0 && (!best || loss > best.kg)) {
      const d = new Date(byMonth.get(keys[i]).dateTime);
      best = { kg: loss, label: new Intl.DateTimeFormat('en', { month: 'long', year: 'numeric' }).format(d) };
    }
  }
  return best;
}
function buildRecords() {
  const out = [];
  const ws = weightsSorted(false);
  if (ws.length) {
    const min = ws.reduce((a, b) => (b.kg < a.kg ? b : a));
    out.push({ label: 'Lowest weight', value: fmtKg(min.kg) + ' kg', date: fmtDate(min.dateTime) });
  }
  const bm = bestMonthlyLoss();
  if (bm) out.push({ label: 'Best month', value: '−' + fmtKg(bm.kg) + ' kg', date: bm.label });
  const deltas = measurementDeltas();
  const w = deltas.waist;
  if (w) {
    const ms = Store.state.measurements.filter(m => m.waist != null && m.waist !== '');
    const minW = ms.reduce((a, b) => (+b.waist < +a.waist ? b : a));
    out.push({ label: 'Smallest waist', value: fmtCm(minW.waist) + ' cm', date: fmtDate(minW.dateTime) });
  }
  let big = null;
  MEAS_FIELDS.forEach(f => {
    const d = deltas[f[0]];
    if (d && d.n >= 2 && d.delta < 0 && (!big || d.delta < big.delta)) big = d;
  });
  if (big) out.push({ label: 'Biggest change', value: big.label + ' −' + fmtCm(Math.abs(big.delta)) + ' cm', date: 'since day one' });
  const ls = longestStreak(Store.state.injections);
  if (ls) out.push({ label: 'Longest streak', value: ls + ' week' + (ls === 1 ? '' : 's'), date: 'consecutive shots' });
  if (Store.state.injections.length) out.push({ label: 'Injections completed', value: String(Store.state.injections.length), date: 'since ' + fmtDate(firstInjection().dateTime) });

/* small, meaningful moments — noticing progress, not gamifying it */
function buildInsights() {

  const ws = weightsSorted(false);
  const nInj = Store.state.injections.length;
  const wk = weeksSinceStart(now);
  if (ws.length >= 3) {
    const latest = ws[ws.length - 1];
    const minPrev = Math.min.apply(null, ws.slice(0, -1).map(w => w.kg));
    if (latest.kg < minPrev) out.push({ icon: 'sparkle', text: 'Lowest weight of your journey — ' + fmtKg(latest.kg) + ' kg.' });
  }
  const sw = startWeight(), cw = currentWeight();
  if (sw != null && cw && sw - cw.kg >= 1) out.push({ icon: 'flag', text: fmtKg(sw - cw.kg) + ' kg down from where you started.' });
  const tb = totalBodyChange();
  if (tb && tb.cm <= -1) out.push({ icon: 'tape', text: fmtCm(Math.abs(tb.cm)) + ' cm smaller than day one, across ' + tb.fields + ' measurements.' });
  if (nInj > 0 && nInj % 5 === 0) out.push({ icon: 'syringe', text: 'Injection #' + nInj + ' complete.' });
  const cs = injectionStreak(Store.state.injections);
  if (cs >= 3 && cs === longestStreak(Store.state.injections)) out.push({ icon: 'trophy', text: cs + ' weeks without missing a shot — your longest run.' });

function weekStats(now) {

/* ---------------- PhotoDB (IndexedDB) ---------------- */
const PhotoDB = {
  db: null, available: false,
  open() {
    return new Promise((res) => {
      if (typeof indexedDB === 'undefined') return res(false);
      let req;
      try { req = indexedDB.open('mounjaro_photos', 1); } catch (e) { return res(false); }
      req.onupgradeneeded = e => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta', { keyPath: 'id' });
        if (!db.objectStoreNames.contains('full')) db.createObjectStore('full', { keyPath: 'id' });
      };
      req.onsuccess = e => { PhotoDB.db = e.target.result; PhotoDB.available = true; res(true); };
      req.onerror = () => res(false);
      req.onblocked = () => res(false);
    });
  },
  tx(store, mode, fn) {
    return new Promise((res, rej) => {
      if (!this.db) return rej(new Error('Photo storage unavailable'));
      const t = this.db.transaction(store, mode);
      const s = t.objectStore(store);
      let out;
      try { out = fn(s); } catch (e) { return rej(e); }
      t.oncomplete = () => res(out && out.result !== undefined ? out.result : out);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error || new Error('aborted'));
    });
  },
  put(meta, fullBlob) {
    return this.tx('meta', 'readwrite', s => s.put(meta))
      .then(() => this.tx('full', 'readwrite', s => s.put({ id: meta.id, blob: fullBlob })));
  },
  updateMeta(meta) { return this.tx('meta', 'readwrite', s => s.put(meta)); },
  allMeta() {
    return new Promise((res, rej) => {
      if (!this.db) return res([]);
      const t = this.db.transaction('meta', 'readonly');
      const req = t.objectStore('meta').getAll();
      req.onsuccess = () => res(req.result || []);
      req.onerror = () => rej(req.error);
    });
  },
  getFull(id) {
    return new Promise((res, rej) => {
      if (!this.db) return rej(new Error('unavailable'));
      const t = this.db.transaction('full', 'readonly');
      const req = t.objectStore('full').get(id);
      req.onsuccess = () => res(req.result ? req.result.blob : null);
      req.onerror = () => rej(req.error);
    });
  },
  remove(id) {
    return this.tx('meta', 'readwrite', s => s.delete(id))
      .then(() => this.tx('full', 'readwrite', s => s.delete(id)));
  },
  clearAll() {
    return this.tx('meta', 'readwrite', s => s.clear())
      .then(() => this.tx('full', 'readwrite', s => s.clear()));
  }
};

function thumbUrl(p) {
  if (!thumbUrls.has(p.id) && p.thumb && typeof URL !== 'undefined' && URL.createObjectURL) {
    try { thumbUrls.set(p.id, URL.createObjectURL(p.thumb)); } catch (e) { return ''; }
  }
  return thumbUrls.get(p.id) || '';
}
function dropThumbUrl(id) {

async function makeScaled(file, maxDim, quality) {
  let bmp = null, w, h;
  if (typeof createImageBitmap === 'function') {
    try { bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
    catch (e) { try { bmp = await createImageBitmap(file); } catch (e2) {} }
  }
  let img = null;
  if (!bmp) {
    const url = URL.createObjectURL(file);
    img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    w = img.naturalWidth; h = img.naturalHeight;
  } else { w = bmp.width; h = bmp.height; }
  const scale = Math.min(1, maxDim / Math.max(w, h));
  const cw = Math.max(1, Math.round(w * scale)), ch = Math.max(1, Math.round(h * scale));
  const cv = document.createElement('canvas'); cv.width = cw; cv.height = ch;
  cv.getContext('2d').drawImage(bmp || img, 0, 0, cw, ch);
  if (bmp && bmp.close) bmp.close();
  return new Promise(res => cv.toBlob(b => res(b), 'image/jpeg', quality));
}
function nearestWeight(dt) {
  const t = new Date(dt).getTime();
  let best = null, bd = Infinity;
  for (const w of Store.state.weights) {
    const d = Math.abs(new Date(w.dateTime).getTime() - t);
    if (d < bd) { bd = d; best = w; }
  }
  return (best && bd <= 3.5 * DAY) ? best : null;
}

/* history integration: hardware/edge back closes sheets & pages */
const Nav = {
  expectedPops: 0,
  push() { try { history.pushState({ mj: 1 }, ''); } catch (e) {} },
  consume() { this.expectedPops++; try { history.back(); } catch (e) { this.expectedPops--; } }
};
window.addEventListener('popstate', () => {
  if (Nav.expectedPops > 0) { Nav.expectedPops--; return; }
  if (Dlg.current) { Dlg.current.resolve(null); return; }
  if (Sheet.current) { Sheet.current.close(true); return; }
  if (Pages.stack.length) { Pages.pop(true); }
});

const Pages = {
  stack: [],
  push(opts) { /* {title, color, render(body,page), right} */
    const page = document.createElement('div');
    page.className = 'page';
    page.innerHTML =
      '<div class="topbar">' +
      '<button class="back-btn" data-act="page-back">' + ic('back', 19) + 'Back</button>' +
      '<div class="title" style="justify-content:center"><span>' + esc(opts.title) + '</span></div>' +
      '<div style="width:64px;display:flex;justify-content:flex-end">' + (opts.right || '') + '</div>' +
      '</div><div class="page-body"></div>';
    $('#pages').appendChild(page);
    const entry = { page, opts };
    this.stack.push(entry);
    this.render(entry);
    requestAnimationFrame(() => requestAnimationFrame(() => page.classList.add('in')));
    Nav.push();
    return entry;
  },
  render(entry) {
    entry = entry || this.stack[this.stack.length - 1];
    if (!entry) return;
    const body = $('.page-body', entry.page);
    const st = entry.page.scrollTop;
    body.innerHTML = '';
    entry.opts.render(body, entry);
    entry.page.scrollTop = st;
  },
  pop(fromHistory) {
    const entry = this.stack.pop();
    if (!entry) return;
    entry.page.classList.remove('in');
    setTimeout(() => entry.page.remove(), 300);
    if (entry.opts.onClose) { try { entry.opts.onClose(); } catch (e) {} }
    if (!fromHistory) Nav.consume();
  },
  popAll() { while (this.stack.length) this.pop(false); }
};

const Sheet = {
  current: null,
  open(opts) { /* {title, sub, html, mount(el, close), noGrab} */
    const reuseEntry = !!this.current;      /* replacing an open sheet: keep its history entry */
    if (this.current) this.current.close(true);
    const wrap = document.createElement('div');
    wrap.className = 'sheet-wrap';
    wrap.innerHTML =
      '<div class="sheet-back"></div>' +
      '<div class="sheet">' + (opts.noGrab ? '' : '<div class="grab"></div>') +
      (opts.title ? '<h2>' + esc(opts.title) + '</h2>' : '') +
      (opts.sub ? '<div class="sheet-sub">' + opts.sub + '</div>' : '') +
      '<div class="sheet-content">' + (opts.html || '') + '</div></div>';
    $('#overlays').appendChild(wrap);
    let closed = false;
    const api = {
      el: $('.sheet', wrap),
      close(fromHistory) {
        if (closed) return; closed = true;
        Sheet.current = null;
        wrap.classList.remove('in');
        setTimeout(() => wrap.remove(), 300);
        if (!fromHistory) Nav.consume();
      }
    };
    $('.sheet-back', wrap).addEventListener('click', () => api.close(false));
    this.current = api;
    requestAnimationFrame(() => requestAnimationFrame(() => wrap.classList.add('in')));
    if (!reuseEntry) Nav.push();
    if (opts.mount) opts.mount(api.el, api.close.bind(api));
    return api;
  }
};

const Dlg = {
  current: null,
  show(opts) { /* {title, msg, buttons:[{label, key, style}]} -> Promise<key|null> */
    return new Promise(resolve => {
      const wrap = document.createElement('div');
      wrap.className = 'dlg-wrap';
      const btns = opts.buttons.map(b =>
        '<button class="btn ' + (b.style || 'btn-tonal') + '" data-key="' + esc(b.key) + '">' + esc(b.label) + '</button>'
      ).join('');
      wrap.innerHTML = '<div class="dlg-back"></div><div class="dlg"><h4>' + esc(opts.title) + '</h4>' +
        (opts.msg ? '<p>' + esc(opts.msg) + '</p>' : '') + btns + '</div>';
      $('#overlays').appendChild(wrap);
      let done = false;
      const finish = key => {
        if (done) return; done = true;
        Dlg.current = null;
        wrap.classList.remove('in');
        setTimeout(() => wrap.remove(), 220);
        if (key !== null) Nav.consume(); /* history entry pushed on open */
        resolve(key);
      };
      Dlg.current = { resolve: finish };
      wrap.addEventListener('click', e => {
        const b = e.target.closest('[data-key]');
        if (b) finish(b.dataset.key);
        else if (e.target.classList.contains('dlg-back') && opts.dismissable !== false) finish('cancel');
      });
      requestAnimationFrame(() => requestAnimationFrame(() => wrap.classList.add('in')));
      Nav.push();
    });
  }
};

/* ---------------- charts ---------------- */
function lineChart(cfg) {
  const w = cfg.w || 336, h = cfg.h || 168;
  const p = { l: cfg.padL || 38, r: 12, t: 14, b: 24 };
  const series = (cfg.series || []).filter(s => s.pts && s.pts.length);
  const all = series.reduce((a, s) => a.concat(s.pts), []);
  if (!all.length) return '<div class="empty">Not enough data for a chart yet.</div>';
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  all.forEach(pt => { if (pt.x < minX) minX = pt.x; if (pt.x > maxX) maxX = pt.x; if (pt.y < minY) minY = pt.y; if (pt.y > maxY) maxY = pt.y; });
  if (cfg.goal != null) { minY = Math.min(minY, cfg.goal); maxY = Math.max(maxY, cfg.goal); }
  if (cfg.minY0) minY = Math.min(minY, 0);
  if (minX === maxX) { minX -= DAY; maxX += DAY; }
  const spanY = (maxY - minY) || 1;
  minY -= spanY * 0.1; maxY += spanY * 0.1;
  if (cfg.minY0 && minY < 0) minY = 0;
  const X = x => p.l + (x - minX) / (maxX - minX) * (w - p.l - p.r);
  const Y = y => h - p.b - (y - minY) / (maxY - minY) * (h - p.t - p.b);
  const yF = cfg.yFmt || (v => String(Math.round(v * 10) / 10));
  let out = '<svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" style="height:auto" preserveAspectRatio="xMidYMid meet">';
  const gid = 'g' + uid();
  out += '<defs><linearGradient id="' + gid + '" x1="0" y1="0" x2="0" y2="1">' +
    '<stop offset="0" stop-color="' + (series[0].color || '#888') + '" stop-opacity=".22"/>' +
    '<stop offset="1" stop-color="' + (series[0].color || '#888') + '" stop-opacity="0"/></linearGradient></defs>';
  // gridlines + y labels
  for (let i = 0; i <= 2; i++) {
    const gy = minY + (maxY - minY) * i / 2;
    const yy = Y(gy).toFixed(1);
    out += '<line x1="' + p.l + '" x2="' + (w - p.r) + '" y1="' + yy + '" y2="' + yy + '" stroke="#E7DCCE" stroke-width="1"' + (i > 0 ? ' stroke-dasharray="1 4"' : '') + ' stroke-linecap="round"/>';
    out += '<text x="' + (p.l - 7) + '" y="' + yy + '" font-size="10" fill="#B5AA97" text-anchor="end" dominant-baseline="middle">' + esc(yF(gy)) + '</text>';
  }
  // x labels: first, mid, last
  const xf = cfg.xFmt || (x => DTF.md.format(new Date(x)));
  [[minX, 'start'], [(minX + maxX) / 2, 'middle'], [maxX, 'end']].forEach(a => {
    out += '<text x="' + X(a[0]).toFixed(1) + '" y="' + (h - 7) + '" font-size="10" fill="#B5AA97" text-anchor="' + a[1] + '">' + esc(xf(a[0])) + '</text>';
  });
  // goal line
  if (cfg.goal != null) {
    out += '<line x1="' + p.l + '" x2="' + (w - p.r) + '" y1="' + Y(cfg.goal).toFixed(1) + '" y2="' + Y(cfg.goal).toFixed(1) + '" stroke="#9AA17B" stroke-width="1.5" stroke-dasharray="4 4"/>';
  }
  // today marker
  if (cfg.todayX != null && cfg.todayX >= minX && cfg.todayX <= maxX) {
    out += '<line x1="' + X(cfg.todayX).toFixed(1) + '" x2="' + X(cfg.todayX).toFixed(1) + '" y1="' + p.t + '" y2="' + (h - p.b) + '" stroke="#B5AA97" stroke-width="1" stroke-dasharray="2 4"/>';
    out += '<text x="' + X(cfg.todayX).toFixed(1) + '" y="' + (p.t - 3) + '" font-size="9" fill="#B5AA97" text-anchor="middle">now</text>';
  }
  series.forEach((s, si) => {
    const path = s.pts.map((pt, i) => (i ? 'L' : 'M') + X(pt.x).toFixed(1) + ' ' + Y(pt.y).toFixed(1)).join('');
    if (si === 0 && s.fill !== false) {
      out += '<path d="' + path + 'L' + X(s.pts[s.pts.length - 1].x).toFixed(1) + ' ' + (h - p.b) + 'L' + X(s.pts[0].x).toFixed(1) + ' ' + (h - p.b) + 'Z" fill="url(#' + gid + ')"/>';
    }
    out += '<path d="' + path + '" fill="none" stroke="' + (s.color || '#888') + '" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"' + (s.dash ? ' stroke-dasharray="3 5"' : '') + '/>';
    if (s.dots) s.pts.forEach(pt => {
      out += '<circle cx="' + X(pt.x).toFixed(1) + '" cy="' + Y(pt.y).toFixed(1) + '" r="2.7" fill="#fff" stroke="' + (s.color || '#888') + '" stroke-width="1.8"/>';
    });
    if (s.endDot) {
      const lp = s.pts[s.pts.length - 1];
      out += '<circle cx="' + X(lp.x).toFixed(1) + '" cy="' + Y(lp.y).toFixed(1) + '" r="4" fill="' + (s.color || '#888') + '" stroke="#fff" stroke-width="2"/>';
    }
  });
  // event markers (e.g. injections)
  (cfg.marks || []).forEach(m => {
    if (m.x < minX || m.x > maxX) return;
    out += '<circle cx="' + X(m.x).toFixed(1) + '" cy="' + (h - p.b) + '" r="3" fill="' + (m.color || '#C96A3A') + '"/>';
  });
  out += '</svg>';
  return '<div class="chartwrap">' + out + '</div>';
}

function sevDots(n) {

/* ---------------- medication page ---------------- */
function medChartHtml() {
  const injs = injectionsSorted(false);
  if (!injs.length) return '<div class="empty"><div class="big">💧</div>Log your first injection and the level curve appears here.</div>';
  const now = Date.now();
  const first = new Date(injs[0].dateTime).getTime();
  const from = Math.max(first, now - 42 * DAY);
  const to = now + 7 * DAY;
  const past = [], future = [];
  for (let t = from; t <= to; t += 6 * 3600000) {
    const pt = { x: t, y: PK.totalAt(injs, t) };
    if (t <= now) past.push(pt); else future.push(pt);
  }
  const nowPt = { x: now, y: PK.totalAt(injs, now) };
  past.push(nowPt); future.unshift(nowPt);
  return lineChart({
    series: [
      { pts: past, color: 'var(--teal)', endDot: true },
      { pts: future, color: 'var(--teal)', dash: true, fill: false }
    ],
    marks: injs.filter(i => { const t = new Date(i.dateTime).getTime(); return t >= from && t <= to; }).map(i => ({ x: new Date(i.dateTime).getTime(), color: 'var(--coral)' })),
    todayX: now, yFmt: v => fmtMg(v), minY0: true
  }) + '<div class="chart-legend"><span><i style="background:var(--teal)"></i>estimated level (mg)</span><span><i style="background:var(--teal);opacity:.4"></i>next 7 days</span><span><i style="background:var(--coral);height:7px;width:7px;border-radius:50%"></i>injections</span></div>';
}

        '<div class="footnote">Each injection follows A(t) = D·F·k<sub>a</sub>/(k<sub>a</sub>−k<sub>e</sub>)·(e^(−k<sub>e</sub>t) − e^(−k<sub>a</sub>t)); all injections from the last 60 days are summed, so week-to-week accumulation is included. Published tirzepatide pharmacokinetics — an estimate for insight, not medical advice.</div></div>';

      };

        try {
          fullBlob = await makeScaled(f, 1400, 0.85);
          thumbBlob = await makeScaled(f, 320, 0.72);
          if (previewUrl) URL.revokeObjectURL(previewUrl);
          previewUrl = URL.createObjectURL(fullBlob);
          $('#ph-preview', el).innerHTML = '<img src="' + previewUrl + '" style="width:100%;border-radius:16px;display:block" alt="">';

        const dt = $('#ph-dt', el).value;
        if (!dt) return toast('Set a date & time');
        const kg = parseNum($('#ph-kg', el).value);

          await PhotoDB.put(meta, fullBlob);
          await refreshPhotoCache();
          if (previewUrl) URL.revokeObjectURL(previewUrl);
          close(); App.refresh(); toast('Photo saved 📸');
        } catch (e) { saveBtn.disabled = false; toast('Could not save photo'); }
      });

function openCompareSheet(idA, idB) {
  let a = photoCache.find(x => x.id === idA), b = photoCache.find(x => x.id === idB);
  if (!a || !b) return;
  if (new Date(a.dateTime) > new Date(b.dateTime)) { const t = a; a = b; b = t; }
  const days = daysBetween(new Date(a.dateTime), new Date(b.dateTime));
  const wd = (a.weightKg != null && b.weightKg != null) ? b.weightKg - a.weightKg : null;
  const urls = [];
  Sheet.open({
    title: 'Compare',
    sub: days + ' day' + (days === 1 ? '' : 's') + ' apart' + (wd != null ? ' · <b class="delta ' + (wd < 0 ? 'down' : wd > 0 ? 'up' : 'flat') + '">' + (wd < 0 ? '↓ ' : wd > 0 ? '↑ ' : '') + fmtKg(Math.abs(wd)) + ' kg</b>' : ''),
    html:
      '<div class="compare">' +

    mount(el) {
      [a, b].forEach((p, i) => {

          const u = URL.createObjectURL(blob); urls.push(u);
          $('#cmp-' + i, el).innerHTML = '<img src="' + u + '" style="width:100%;display:block" alt="">';
        }).catch(() => {});
      });
      /* revoke when sheet is removed */
      const obs = new MutationObserver(() => {
        if (!document.body.contains(el)) { urls.forEach(u => { try { URL.revokeObjectURL(u); } catch (e) {} }); obs.disconnect(); }
      });
      obs.observe(document.body, { childList: true, subtree: true });
    }
  });

  Pages.render();
}

  Store.state.weights.forEach(x => { if (dateKey(x.dateTime) === key) out.push({ type: 'w', x }); });

  return out.sort((p, q) => new Date(p.x.dateTime) - new Date(q.x.dateTime));

/* ---------------- backup / export / restore ---------------- */
function csvEsc(v) {
  v = v == null ? '' : String(v);
  return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
}
function blobToDataURL(blob) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = () => rej(r.error);
    r.readAsDataURL(blob);
  });
}
function dataURLtoBlob(durl) {
  const m = durl.split(',');
  const mime = (m[0].match(/data:(.*?);/) || [])[1] || 'image/jpeg';
  const bin = atob(m[1]);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}
async function shareFile(filename, mime, text) {
  const blob = new Blob([text], { type: mime });
  if (navigator.share && navigator.canShare) {
    try {
      const file = new File([blob], filename, { type: mime });
      if (navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: filename });
        return;
      }
    } catch (e) { if (e && e.name === 'AbortError') return; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
}
function dataOnlyPayload() {
  const d = JSON.parse(JSON.stringify(Store.state));
  d.exportedAt = new Date().toISOString();
  d.appVersion = APP_VERSION;
  return d;
}
async function exportData(includePhotos) {
  const d = dataOnlyPayload();
  if (includePhotos && PhotoDB.available) {
    d.photos = [];
    for (const p of photoCache) {
      try {
        const full = await PhotoDB.getFull(p.id);
        d.photos.push({
          id: p.id, dateTime: p.dateTime, note: p.note || '', weightKg: p.weightKg || null,
          thumbData: p.thumb ? await blobToDataURL(p.thumb) : null,
          fullData: full ? await blobToDataURL(full) : null
        });
      } catch (e) {}
    }
  }
  return JSON.stringify(d);
}
function stamp() { const d = new Date(); return d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()); }
async function doExport(includePhotos) {
  toast('Preparing backup…');
  try {
    const json = await exportData(includePhotos);
    await shareFile('mounjaro-backup-' + stamp() + (includePhotos ? '-full' : '') + '.json', 'application/json', json);
  } catch (e) { toast('Export failed'); }
}

        } else if (k === 'csv-sym') {

          rows = [['dateTime', 'name', 'severity', 'dayAfterInjection', 'note']].concat(

              .map(s => [s.dateTime, s.name, s.severity, dayAfterInjection(Store.state.injections, s.dateTime) || '', s.note || '']));
        } else {
          name = 'measurements';
          rows = [['dateTime'].concat(MEAS_FIELDS.map(f => f[0]))].concat(
            Store.state.measurements.slice().sort((a, b) => new Date(a.dateTime) - new Date(b.dateTime))
              .map(mm => [mm.dateTime].concat(MEAS_FIELDS.map(f => (mm[f[0]] != null && mm[f[0]] !== '') ? mm[f[0]] : ''))));
        }
        const csv = rows.map(r => r.map(csvEsc).join(',')).join('\r\n');
        shareFile('mounjaro-' + name + '-' + stamp() + '.csv', 'text/csv', csv);
        close();
      });
    }
  });

function looksLikeBackup(d) {
  return d && typeof d === 'object' && (Array.isArray(d.injections) || Array.isArray(d.weights) || d.settings);
}
async function doRestore(file) {
  let text;
  try { text = await file.text(); } catch (e) { return toast('Could not read file'); }
  let data;
  try { data = JSON.parse(text); } catch (e) { return toast('Not a valid backup file'); }
  if (!looksLikeBackup(data)) return toast('That file doesn\u2019t look like a Mounjaro Tracker backup');
  const counts = ['injections', 'weights', 'symptoms', 'measurements'].map(k => (Array.isArray(data[k]) ? data[k].length : 0));
  const nPhotos = Array.isArray(data.photos) ? data.photos.length : 0;
  const ok = await confirmDlg('Restore this backup?',
    counts[0] + ' injections, ' + counts[1] + ' weights, ' + counts[2] + ' symptoms, ' + counts[3] + ' measurements' + (nPhotos ? ', ' + nPhotos + ' photos' : '') + '. Current data will be replaced.',
    'Restore', true);
  if (!ok) return;
  try { localStorage.setItem('mounjaro_prerestore_' + Date.now(), JSON.stringify(Store.state)); } catch (e) {}
  const photos = Array.isArray(data.photos) ? data.photos : null;
  delete data.photos;
  Store.state = Store.migrate(data);
  Store.persist();
  if (photos && PhotoDB.available) {
    toast('Restoring photos…');
    try {
      await PhotoDB.clearAll();
      thumbUrls.forEach((u) => { try { URL.revokeObjectURL(u); } catch (e) {} });
      thumbUrls.clear();
      for (const p of photos) {
        if (!p.fullData) continue;
        const meta = { id: p.id || uid(), dateTime: p.dateTime, note: p.note || '', weightKg: p.weightKg || null, thumb: p.thumbData ? dataURLtoBlob(p.thumbData) : await makeScaled(dataURLtoBlob(p.fullData), 320, 0.72) };
        await PhotoDB.put(meta, dataURLtoBlob(p.fullData));
      }
    } catch (e) {}
  }
  await refreshPhotoCache();
  Pages.popAll();
  App.refresh();
  toast('Backup restored ✓');
}
async function eraseAll() {
  if (!await confirmDlg('Erase all data?', 'Every record, setting and photo on this device will be deleted.', 'Erase', true)) return;
  if (!await confirmDlg('Are you absolutely sure?', 'This cannot be undone.', 'Yes, erase everything', true)) return;
  try { localStorage.removeItem(LS_KEY); } catch (e) {}
  if (PhotoDB.available) await PhotoDB.clearAll().catch(() => {});
  thumbUrls.forEach(u => { try { URL.revokeObjectURL(u); } catch (e) {} });
  thumbUrls.clear();
  photoCache = [];
  Store.load();
  Pages.popAll();
  App.refresh();
  toast('All data erased');
}

  token: null, tokenExp: 0, tokenClient: null, gisLoading: null, syncTimer: null, busy: false,
  API: 'https://www.googleapis.com/drive/v3',
  UP: 'https://www.googleapis.com/upload/drive/v3',
  loadGis() {
    if (window.google && window.google.accounts && window.google.accounts.oauth2) return Promise.resolve();
    if (this.gisLoading) return this.gisLoading;
    this.gisLoading = new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = 'https://accounts.google.com/gsi/client';
      s.async = true;
      s.onload = () => res();
      s.onerror = () => { Drive.gisLoading = null; rej(new Error('Could not load Google sign-in (offline?)')); };
      document.head.appendChild(s);
    });
    return this.gisLoading;
  },
  getToken(interactive) {
    if (this.token && Date.now() < this.tokenExp) return Promise.resolve(this.token);
    const cid = Store.state.settings.drive.clientId;
    if (!cid) return Promise.reject(new Error('Missing Client ID'));
    return this.loadGis().then(() => new Promise((res, rej) => {
      try {
        this.tokenClient = google.accounts.oauth2.initTokenClient({
          client_id: cid,
          scope: 'https://www.googleapis.com/auth/drive.file',
          callback: (resp) => {
            if (resp && resp.access_token) {
              Drive.token = resp.access_token;
              Drive.tokenExp = Date.now() + (((+resp.expires_in) || 3600) - 60) * 1000;
              res(Drive.token);
            } else rej(new Error('No token received'));
          },
          error_callback: (err) => rej(new Error(err && err.type === 'popup_closed' ? 'Sign-in cancelled' : 'Sign-in failed — check Client ID & authorized origin'))
        });
        this.tokenClient.requestAccessToken({ prompt: interactive ? 'consent' : '' });
      } catch (e) { rej(e); }
    }));
  },
  async api(url, opts, retried) {
    const tok = await this.getToken(false);
    opts = opts || {};
    opts.headers = Object.assign({}, opts.headers, { Authorization: 'Bearer ' + tok });
    const r = await fetch(url, opts);
    if (r.status === 401 && !retried) {
      this.token = null;
      return this.api(url, opts, true);
    }
    if (!r.ok) throw new Error('Drive error ' + r.status);
    return r;
  },
  async ensureSetup() {
    const dr = Store.state.settings.drive;
    if (!dr.folderId) {
      const q = encodeURIComponent("name='Mounjaro Tracker' and mimeType='application/vnd.google-apps.folder' and trashed=false");
      const r = await (await this.api(this.API + '/files?q=' + q + '&fields=files(id)')).json();
      if (r.files && r.files.length) dr.folderId = r.files[0].id;
      else {
        const c = await (await this.api(this.API + '/files', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: 'Mounjaro Tracker', mimeType: 'application/vnd.google-apps.folder' })
        })).json();
        dr.folderId = c.id;
      }
    }
    if (!dr.fileId) {
      const q2 = encodeURIComponent("name='mounjaro-backup.json' and '" + dr.folderId + "' in parents and trashed=false");
      const r2 = await (await this.api(this.API + '/files?q=' + q2 + '&fields=files(id,appProperties)')).json();
      if (r2.files && r2.files.length) { dr.fileId = r2.files[0].id; return r2.files[0]; }
    }
    Store.persist();
    return null;
  },
  async remoteInfo() {
    const dr = Store.state.settings.drive;
    if (!dr.fileId) return null;
    try {
      const r = await (await this.api(this.API + '/files/' + dr.fileId + '?fields=id,appProperties,modifiedTime')).json();
      return r;
    } catch (e) { return null; }
  },
  multipartBody(meta, json, boundary) {
    return '--' + boundary + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' +
      JSON.stringify(meta) + '\r\n--' + boundary + '\r\nContent-Type: application/json\r\n\r\n' +
      json + '\r\n--' + boundary + '--';
  },
  async push(manual) {
    const dr = Store.state.settings.drive;
    if (!dr.enabled || this.busy) return;
    this.busy = true;
    try {
      await this.ensureSetup();
      const json = JSON.stringify(dataOnlyPayload());
      const hash = fnv1a(json);
      if (dr.fileId) {
        const remote = await this.remoteInfo();
        const rHash = remote && remote.appProperties && remote.appProperties.hash;
        if (rHash && dr.lastHash && rHash !== dr.lastHash) {
          /* someone else wrote since our last sync */
          this.busy = false;
          const k = await Dlg.show({
            title: 'Sync conflict',
            msg: 'The backup on Drive changed since this device last synced. Which version wins?',
            dismissable: false,
            buttons: [
              { label: 'Use Drive version here', key: 'pull', style: 'btn-tonal' },
              { label: 'Overwrite Drive with this device', key: 'push', style: 'btn-primary' },
              { label: 'Cancel', key: 'cancel', style: 'btn-ghost' }
            ]
          });
          if (k === 'pull') return this.pull();
          if (k !== 'push') return;
          this.busy = true;
        }
      }
      const boundary = 'mjb' + uid();
      if (dr.fileId) {
        await this.api(this.UP + '/files/' + dr.fileId + '?uploadType=multipart', {
          method: 'PATCH',
          headers: { 'Content-Type': 'multipart/related; boundary=' + boundary },
          body: this.multipartBody({ appProperties: { hash } }, json, boundary)
        });
      } else {
        const r = await (await this.api(this.UP + '/files?uploadType=multipart', {
          method: 'POST',
          headers: { 'Content-Type': 'multipart/related; boundary=' + boundary },
          body: this.multipartBody({ name: 'mounjaro-backup.json', parents: [dr.folderId], appProperties: { hash } }, json, boundary)
        })).json();
        dr.fileId = r.id;
      }
      dr.lastHash = hash;
      dr.lastSync = new Date().toISOString();
      Store.persist();
      if (manual) { toast('Synced to Drive ✓'); App.refresh(); }
    } catch (e) {
      if (manual) toast(e.message || 'Sync failed');
    } finally { this.busy = false; }
  },
  async pull() {
    const dr = Store.state.settings.drive;
    if (!dr.fileId) return;
    try {
      const r = await this.api(this.API + '/files/' + dr.fileId + '?alt=media');
      const data = await r.json();
      if (!looksLikeBackup(data)) throw new Error('Drive file unreadable');
      const keepDrive = JSON.parse(JSON.stringify(dr));
      delete data.photos;
      Store.state = Store.migrate(data);
      Store.state.settings.drive = keepDrive;
      Store.state.settings.drive.lastHash = fnv1a(JSON.stringify(dataOnlyPayload()));
      Store.state.settings.drive.lastSync = new Date().toISOString();
      Store.persist();
      Pages.popAll();
      App.refresh();
      toast('Restored from Drive ✓');
    } catch (e) { toast(e.message || 'Could not read Drive backup'); }
  },
  scheduleAutoSync() {
    const dr = Store.state.settings.drive;
    if (!dr.enabled || !dr.clientId) return;
    clearTimeout(this.syncTimer);
    this.syncTimer = setTimeout(() => this.push(false), 4000);
  },
  async connect() {
    const cid = ($('#drive-cid') ? $('#drive-cid').value.trim() : Store.state.settings.drive.clientId || '').trim();
    if (!cid || cid.indexOf('.apps.googleusercontent.com') < 0) return toast('Paste a valid OAuth Client ID first');
    Store.state.settings.drive.clientId = cid;
    Store.persist();
    toast('Opening Google sign-in…');
    try {
      await this.getToken(true);
      const existing = await this.ensureSetup();
      const dr = Store.state.settings.drive;
      if (existing || dr.fileId) {
        const k = await Dlg.show({
          title: 'Backup found on Drive',
          msg: 'A previous backup exists. Load it here, or keep this device\u2019s data and overwrite it?',
          dismissable: false,
          buttons: [
            { label: 'Load Drive backup', key: 'pull', style: 'btn-tonal' },
            { label: 'Keep this device\u2019s data', key: 'push', style: 'btn-primary' }
          ]
        });
        dr.enabled = true; Store.persist();
        if (k === 'pull') await this.pull(); else await this.push(true);
      } else {
        Store.state.settings.drive.enabled = true;
        Store.persist();
        await this.push(true);
      }
      App.refresh();
    } catch (e) { toast(e.message || 'Could not connect'); }
  },
  disconnect() {
    const dr = Store.state.settings.drive;
    dr.enabled = false;
    this.token = null; this.tokenExp = 0;
    clearTimeout(this.syncTimer);
    Store.persist();
    App.refresh();
    toast('Drive sync off — file stays in your Drive');
  }
};

/* ---------------- global event delegation ---------------- */
const Handlers = {
  'open-cal': () => openCalendarPage(),
  'open-settings': () => openSettingsPage(),
  'open-med': () => openMedicationPage(),
  'open-weight': () => openWeightPage(),
  'open-sym': () => openSymptomsPage(),
  'open-inj': () => openInjectionsPage(),
  'open-photos': () => openPhotosPage(),
  'open-journey': () => openJourneyPage(),
  'feel-good': () => {
    Store.state.meta.feelGoodKey = dateKey(new Date());
    Store.save(); App.refresh();
    toast('Noted — good days count too 🌿');
  },
  'page-back': () => Pages.pop(false),
  'add-injection': () => openInjectionSheet(null),
  'add-weight': () => openWeightSheet(null),
  'add-symptom': () => openSymptomSheet(null),
  'add-measurement': () => openMeasurementSheet(null),
  'add-photo': () => openPhotoAddSheet(),
  'edit-injection': el => { const x = Store.state.injections.find(i => i.id === el.dataset.id); if (x) openInjectionSheet(x); },
  'edit-weight': el => { const x = Store.state.weights.find(i => i.id === el.dataset.id); if (x) openWeightSheet(x); },
  'edit-symptom': el => { const x = Store.state.symptoms.find(i => i.id === el.dataset.id); if (x) openSymptomSheet(x); },
  'edit-measurement': el => { const x = Store.state.measurements.find(i => i.id === el.dataset.id); if (x) openMeasurementSheet(x); },
  'view-photo': el => openPhotoViewer(el.dataset.id),
  'toggle-compare': () => { photoCompare = !photoCompare; photoSel = []; Pages.render(); },
  'cancel-compare': () => { photoCompare = false; photoSel = []; Pages.render(); },
  'pick-compare': el => {
    const id = el.dataset.id;
    const i = photoSel.indexOf(id);
    if (i >= 0) photoSel.splice(i, 1); else photoSel.push(id);
    if (photoSel.length === 2) openCompareSheet(photoSel[0], photoSel[1]);
    else Pages.render();
  },
  'check': el => Actions.toggleChecklist(+el.dataset.i),
  'dismiss-setup': (el, e) => { e.stopPropagation(); Actions.patchSettings({ setupDismissed: true }); },
  'wrange': el => { weightRange = el.dataset.r; Pages.render(); },
  'cal-prev': () => { calState.m--; if (calState.m < 0) { calState.m = 11; calState.y--; } Pages.render(); },
  'cal-next': () => { calState.m++; if (calState.m > 11) { calState.m = 0; calState.y++; } Pages.render(); },
  'cal-day': el => { calState.selKey = el.dataset.k; Pages.render(); },
  'edit-schedule': () => openScheduleSheet(),
  'save-body': () => {
    const hv = parseNum($('#set-height').value), gv = parseNum($('#set-goal').value), sv = parseNum($('#set-start').value);
    if ($('#set-height').value && (!hv || hv < 90 || hv > 250)) return toast('Height should be 90–250 cm');
    if ($('#set-goal').value && (!gv || gv < 20 || gv > 400)) return toast('Goal should be 20–400 kg');
    if ($('#set-start').value && (!sv || sv < 20 || sv > 400)) return toast('Start weight should be 20–400 kg');
    Actions.patchSettings({ heightCm: hv || null, goalKg: gv || null, startKgOverride: sv || null });
    toast('Saved');
  },
  'save-checklist': () => {
    const items = $('#set-checklist').value.split('\n').map(s => s.trim()).filter(Boolean).slice(0, 12);
    if (!items.length) return toast('Add at least one item');
    Actions.patchSettings({ checklistItems: items });
    Store.state.checklist = { dateKey: null, done: [] };
    Store.save();
    toast('Checklist saved');
  },
  'export-full': () => doExport(true),
  'export-data': () => doExport(false),
  'export-csv': () => doExportCsv(),
  'restore': () => {
    const inp = $('#restore-file');
    if (!inp) return;
    inp.onchange = () => { if (inp.files && inp.files[0]) doRestore(inp.files[0]); inp.value = ''; };
    inp.click();
  },
  'erase-all': () => eraseAll(),
  'drive-connect': () => Drive.connect(),
  'drive-sync': () => Drive.push(true),
  'drive-disconnect': () => Drive.disconnect(),
  'export-quarantine': () => {
    const k = Store.state.meta.quarantineKey;
    let raw = null;
    try { raw = k && localStorage.getItem(k); } catch (e) {}
    if (raw) shareFile('mounjaro-quarantined.json', 'application/json', raw);
    else toast('No quarantined data found');
  }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const fn = Handlers[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el, e); }
});

/* ---------------- boot ---------------- */
const App = {
  refresh() {
    renderDashboard();
    if (Pages.stack.length) Pages.render();
  },
  actions: Actions, store: Store, pk: PK,
  exportData, Pages, Sheet
};
window.App = App;

function installPwaBits() {
  /* runtime manifest (iOS mainly reads the apple-* meta tags, this helps other browsers) */
  try {
    const manifest = {
      name: 'Mounjaro Tracker', short_name: 'Mounjaro',
      display: 'standalone', start_url: '.', scope: '.',
      background_color: '#F6F3ED', theme_color: '#F6F3ED',
      icons: [{ src: document.querySelector('link[rel="apple-touch-icon"]').href, sizes: '180x180', type: 'image/png' }]
    };
    const url = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' }));
    const link = document.createElement('link');
    link.rel = 'manifest'; link.href = url;
    document.head.appendChild(link);
    const fav = document.createElement('link');
    fav.rel = 'icon';
    fav.href = document.querySelector('link[rel="apple-touch-icon"]').href;
    document.head.appendChild(fav);
  } catch (e) {}
  /* optional companion service worker for offline (iOS needs a real file) */
  try {
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').then(reg => {
        reg.update().catch(() => {});
        /* a newer build finished downloading while the app was open */
        reg.addEventListener('updatefound', () => {
          const sw = reg.installing;
          if (!sw) return;
          sw.addEventListener('statechange', () => {
            if (sw.state === 'installed' && navigator.serviceWorker.controller) {
              Dlg.show({
                title: 'Update ready',
                msg: 'A newer version of the app has been downloaded. Reload now to use it? Your data is untouched.',
                buttons: [
                  { label: 'Reload', key: 'go', style: 'btn-primary' },
                  { label: 'Later', key: 'later', style: 'btn-ghost' }
                ]
              }).then(k => { if (k === 'go') { try { sw.postMessage('skipWaiting'); } catch (e) {} location.reload(); } });
            }
          });
        });
        /* check again whenever the app comes back to the foreground */
        document.addEventListener('visibilitychange', () => {
          if (!document.hidden) reg.update().catch(() => {});
        });
      }).catch(() => {});
    }
  } catch (e) {}
}
let lastDayKey = dateKey(new Date());
function boot() {
  Store.load();
  renderTopbar();
  renderDashboard();
  installPwaBits();
  PhotoDB.open().then(ok => ok ? refreshPhotoCache() : null).then(() => renderDashboard()).catch(() => {});
  if (Store.corruptRecovered) {
    setTimeout(() => Dlg.show({
      title: 'Data recovered',
      msg: 'Stored data was corrupted and has been quarantined. The app restarted fresh — you can export the quarantined snapshot from Settings → About.',
      buttons: [{ label: 'OK', key: 'ok', style: 'btn-primary' }]
    }), 400);
  }
  /* keep "days until" and shot-day state fresh */
  setInterval(() => {
    const k = dateKey(new Date());
    if (k !== lastDayKey) { lastDayKey = k; App.refresh(); }
  }, 60000);
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && !Sheet.current) App.refresh();
  });
}
boot();
